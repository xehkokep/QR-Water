<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR оборудования</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QR">
<meta name="theme-color" content="#0b5fff">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d5dce3;--acc:#0b5fff;--accink:#fff;--ok:#1a8a4a;--danger:#c62828;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161d;--card:#18222c;--ink:#e8eef4;--mute:#93a1af;--line:#2a3743;--acc:#5b94ff;--accink:#0a1220;--ok:#4cc27d;--danger:#ff7b72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f161d;--card:#18222c;--ink:#e8eef4;--mute:#93a1af;--line:#2a3743;--acc:#5b94ff;--accink:#0a1220;--ok:#4cc27d;--danger:#ff7b72;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.35 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
h1{font-size:20px;font-weight:800;margin:0;flex:1}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btn.bad{color:var(--danger)}
.btn:focus-visible,.chip:focus-visible,.row:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.search{width:100%;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -14px 0;padding:0 14px 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:600;white-space:nowrap}
.chip small{color:var(--mute);font-weight:600;margin-left:4px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on small{color:var(--bg);opacity:.7}
.prog{margin-top:8px;font-size:13px;color:var(--mute)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
main{padding:6px 14px 110px}
h2{font-size:14px;font-weight:600;color:var(--mute);margin:18px 0 6px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;width:100%;text-align:left}
.row img{width:60px;height:60px;object-fit:cover;border-radius:8px;background:#fff;flex:none}
.row .t{flex:1;min-width:0}
.row .n{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:13px;color:var(--mute)}
.row.done{opacity:.55}
.row.done .n{text-decoration:line-through}
.tick{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;font-size:20px;color:transparent}
.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.empty{text-align:center;color:var(--mute);padding:50px 20px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:999px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px;font-size:18px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.in{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.pv{width:100%;max-height:240px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line);display:none;margin-top:8px}
.acts{display:flex;gap:8px;margin-top:16px}
.acts .btn{flex:1}
.view{align-items:stretch}
.view .sheet{border-radius:0;max-width:none;height:100%;max-height:none;display:flex;flex-direction:column}
.big{flex:1;min-height:0;background:#fff;border-radius:12px;display:grid;place-items:center;padding:8px}
.big img{max-width:100%;max-height:100%;object-fit:contain}
.grip{width:30px;height:48px;border:none;background:none;color:var(--mute);font-size:24px;touch-action:none;cursor:grab;flex:none;padding:0}
.row.drag{position:relative;z-index:3;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.btn:disabled{opacity:.35}
</style></head>
<body>
<header>
  <div class="top"><h1>QR оборудования</h1><button class="btn" id="reset">Новый месяц</button></div>
  <input class="search" id="q" type="search" placeholder="Поиск по названию или магазину">
  <div class="chips" id="chips"></div>
  <div class="prog"><span id="pt"></span><div class="bar"><i id="pb"></i></div></div>
</header>
<main id="list"></main>
<button class="btn pri fab" id="add">+ Добавить QR</button>

<div class="ov" id="sheetOv"><div class="sheet">
  <h3 id="sTitle">Новый QR-код</h3>
  <div style="display:flex;gap:8px">
    <button class="btn" style="flex:1" id="cam">Сфотографировать</button>
    <button class="btn" style="flex:1" id="gal">Из галереи</button>
  </div>
  <button class="btn" style="width:100%;margin-top:8px" id="impBtn">Загрузить целый лист (до 16 кодов)</button>
  <input type="file" id="fImp" accept="image/*" hidden>
  <input type="file" id="fCam" accept="image/*" capture="environment" hidden>
  <input type="file" id="fGal" accept="image/*" hidden>
  <img class="pv" id="pv" alt="Фото QR-кода">
  <label for="nm">Оборудование</label>
  <input class="in" id="nm" placeholder="Например, холодильник №2">
  <label for="st">Магазин</label>
  <input class="in" id="st" placeholder="Например, Лесная 14" list="stores">
  <datalist id="stores"></datalist>
  <label for="dy">День</label>
  <select class="in" id="dy"></select>
  <div class="acts"><button class="btn" id="sCancel">Отмена</button><button class="btn pri" id="sSave">Сохранить</button></div>
</div></div>

<div class="ov view" id="viewOv"><div class="sheet">
  <div style="margin-bottom:8px"><div id="vn" style="font-weight:800;font-size:18px"></div><div id="vs" style="color:var(--mute)"></div></div>
  <div class="big" id="bigBox" style="touch-action:pan-y"><img id="vi" alt="QR-код" draggable="false"></div>
  <div class="acts" style="align-items:center"><button class="btn" id="vprev" aria-label="Предыдущий">‹</button><span id="vcnt" style="flex:2;text-align:center;color:var(--mute)"></span><button class="btn" id="vnext" aria-label="Следующий">›</button></div>
  <div class="acts"><select class="in" id="vd" style="flex:1" aria-label="День"></select><button class="btn" id="vc" style="flex:1"></button></div>
  <div class="acts"><button class="btn" id="vclose">Закрыть</button><button class="btn" id="ve">Изменить</button><button class="btn bad" id="vx">Удалить</button></div>
</div></div>


<div class="ov view" id="impOv"><div class="sheet">
 <div id="st1" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <h3 style="margin:0 0 4px">Лист с QR-кодами</h3>
  <div style="color:var(--mute);font-size:14px;margin-bottom:8px">Тяните красные точки, чтобы линии сетки легли между наклейками. Рамку можно двигать пальцем.</div>
  <div id="icbox" style="flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center"><canvas id="ic" style="touch-action:none;border-radius:8px;display:block"></canvas></div>
  <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
   <button class="btn" id="rot">Повернуть</button>
   <button class="btn" id="setBtn">Настройки сетки</button>
  </div>
  <div id="setBox" style="display:none;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px">
   <label style="margin:0;flex:1;min-width:120px">Наклон<input id="fine" type="range" min="-8" max="8" step="0.5" value="0" style="width:100%"></label>
   <label style="margin:0">Столбцов<input class="in" id="cols" type="number" min="1" max="8" value="4" style="width:64px"></label>
   <label style="margin:0">Строк<input class="in" id="rows" type="number" min="1" max="8" value="5" style="width:64px"></label>
  </div>
  <div class="acts"><button class="btn" id="impCancel">Отмена</button><button class="btn pri" id="impNext">Нарезать</button></div>
 </div>
 <div id="st2" style="display:none;flex-direction:column;flex:1;min-height:0">
  <h3 style="margin:0 0 4px">Впишите названия</h3>
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><span style="color:var(--mute)">День для всех:</span><select class="in" id="impDay" style="flex:1"></select></div>
  <div id="ocrSt" style="color:var(--mute);font-size:14px;margin-bottom:6px;min-height:1.3em"></div>
  <div id="impList" style="flex:1;min-height:0;overflow:auto"></div>
  <div class="acts"><button class="btn" id="impBack">Назад</button><button class="btn pri" id="impSave">Сохранить всё</button></div>
 </div>
</div></div>
<script>
var DAYS=[[1,"Пн"],[2,"Вт"],[3,"Ср"],[4,"Чт"],[5,"Пт"],[6,"Сб"],[7,"Вс"]];
var items=[],filter=String(new Date().getDay()||7),query="",viewId=null,editId=null,newImg=null,delTimer=null;
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var dayName=function(d){return d?DAYS[d-1][1]:"Без дня"};

function DB(){return new Promise(function(res,rej){var r=indexedDB.open("qr-eq",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv")};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function load(){return DB().then(function(db){return new Promise(function(res){var q=db.transaction("kv").objectStore("kv").get("items");q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])}})}).catch(function(){return []})}
function save(){try{DB().then(function(db){db.transaction("kv","readwrite").objectStore("kv").put(items,"items")}).catch(function(){})}catch(e){}}

function shown(){
  var q=query.trim().toLowerCase();
  return items.filter(function(i){
    var okDay=filter==="all"||(filter==="0"?!i.day:String(i.day)===filter);
    return okDay&&(!q||(i.name+" "+i.store).toLowerCase().indexOf(q)>-1);
  }).sort(function(a,b){return filter==="all"?(((a.day||8)-(b.day||8))||(a.pos-b.pos)):(a.pos-b.pos)});
}
function render(){
  var c='<button class="chip'+(filter==="all"?" on":"")+'" data-f="all">Все<small>'+items.length+'</small></button>';
  DAYS.concat([[0,"Без дня"]]).forEach(function(d){
    var n=items.filter(function(i){return (i.day||0)===d[0]}).length;
    c+='<button class="chip'+(filter===String(d[0])?" on":"")+'" data-f="'+d[0]+'">'+d[1]+'<small>'+n+'</small></button>';
  });
  $("chips").innerHTML=c;
  var s=shown(),done=s.filter(function(i){return i.done}).length;
  $("pt").textContent=s.length?("Отсканировано "+done+" из "+s.length):"";
  $("pb").style.width=s.length?(done/s.length*100)+"%":"0";
  if(!s.length){$("list").innerHTML='<div class="empty">'+(items.length?"Здесь пока пусто.":"Добавьте первый QR-код: сфотографируйте его и выберите день.")+'</div>';return}
  var h="",grip=filter!=="all";
  s.forEach(function(i){
    h+='<div class="row'+(i.done?" done":"")+'" role="button" tabindex="0" data-o="'+i.id+'">'+(grip?'<button class="grip" data-h aria-label="Перетащить">≡</button>':"")+'<img src="'+i.img+'" alt=""><div class="t"><div class="n">'+esc(i.name)+'</div><div class="d">'+esc(i.store||"Без магазина")+(filter==="all"?" · "+dayName(i.day):"")+'</div></div><button class="tick" data-t="'+i.id+'" aria-label="Отметить отсканированным">✓</button></div>';
  });
  $("list").innerHTML=h;
}
function fillDays(sel,val){sel.innerHTML='<option value="0">Без дня</option>'+DAYS.map(function(d){return'<option value="'+d[0]+'">'+d[1]+"</option>"}).join("");sel.value=String(val||0)}
function get(id){return items.filter(function(i){return i.id===id})[0]}

$("chips").onclick=function(e){var b=e.target.closest("[data-f]");if(b){filter=b.dataset.f;render()}};
$("q").oninput=function(){query=this.value;render()};
$("list").onclick=function(e){
  if(e.target.closest("[data-h]"))return;
  var t=e.target.closest("[data-t]");
  if(t){var i=get(t.dataset.t);i.done=!i.done;save();render();return}
  var o=e.target.closest("[data-o]");if(o)openView(o.dataset.o);
};
$("list").onkeydown=function(e){if(e.key==="Enter"&&e.target.dataset.o)openView(e.target.dataset.o)};

var vorder=[],vidx=0;
function openView(id){
  vorder=shown().map(function(i){return i.id});vidx=Math.max(0,vorder.indexOf(id));showView();
  $("viewOv").classList.add("show");
}
function showView(){
  viewId=vorder[vidx];var i=get(viewId);
  $("vn").textContent=i.name;$("vs").textContent=i.store||"";$("vi").src=i.img;
  fillDays($("vd"),i.day);$("vc").textContent=i.done?"Снять отметку":"Отсканирован";
  $("vcnt").textContent=(vidx+1)+" из "+vorder.length;
  $("vprev").disabled=vidx===0;$("vnext").disabled=vidx===vorder.length-1;
  $("vx").textContent="Удалить";$("vx").dataset.arm="";
}
function go(d){var n=vidx+d;if(n<0||n>=vorder.length)return;vidx=n;showView()}
$("vprev").onclick=function(){go(-1)};$("vnext").onclick=function(){go(1)};
var sx=null,sy=0;
$("bigBox").onpointerdown=function(e){sx=e.clientX;sy=e.clientY};
$("bigBox").onpointerup=function(e){if(sx===null)return;var dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?1:-1)};
$("bigBox").onpointercancel=function(){sx=null};
function closeView(){$("viewOv").classList.remove("show");viewId=null;render()}
$("vclose").onclick=closeView;
$("vd").onchange=function(){var i=get(viewId);i.day=+this.value||null;save()};
$("vc").onclick=function(){var i=get(viewId);i.done=!i.done;save();if(i.done&&vidx<vorder.length-1)go(1);else if(i.done)closeView();else showView()};
$("vx").onclick=function(){
  var b=this;
  if(b.dataset.arm){items=items.filter(function(i){return i.id!==viewId});save();vorder.splice(vidx,1);if(!vorder.length){closeView();return}vidx=Math.min(vidx,vorder.length-1);showView();return}
  b.dataset.arm="1";b.textContent="Точно удалить?";
  clearTimeout(delTimer);delTimer=setTimeout(function(){b.dataset.arm="";b.textContent="Удалить"},3000);
};
$("ve").onclick=function(){var i=get(viewId);$("viewOv").classList.remove("show");openSheet(i)};

function openSheet(i){
  editId=i?i.id:null;newImg=null;
  $("sTitle").textContent=i?"Изменить QR-код":"Новый QR-код";
  $("nm").value=i?i.name:"";$("st").value=i?i.store:"";
  fillDays($("dy"),i?i.day:0);
  var pv=$("pv");if(i){pv.src=i.img;pv.style.display="block"}else{pv.removeAttribute("src");pv.style.display="none"}
  $("stores").innerHTML=Array.from(new Set(items.map(function(x){return x.store}).filter(Boolean))).map(function(s){return'<option value="'+esc(s)+'">'}).join("");
  $("sheetOv").classList.add("show");
}
function closeSheet(){$("sheetOv").classList.remove("show");if(viewId)render()}
$("add").onclick=function(){openSheet(null)};
$("sCancel").onclick=function(){closeSheet()};
$("cam").onclick=function(){$("fCam").click()};
$("gal").onclick=function(){$("fGal").click()};
function onFile(e){
  var f=e.target.files[0];if(!f)return;
  var img=new Image(),u=URL.createObjectURL(f);
  img.onload=function(){
    var m=1000,k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    newImg=c.toDataURL("image/jpeg",.85);URL.revokeObjectURL(u);
    $("pv").src=newImg;$("pv").style.display="block";
  };
  img.src=u;e.target.value="";
}
$("fCam").onchange=onFile;$("fGal").onchange=onFile;
$("sSave").onclick=function(){
  var name=$("nm").value.trim();
  if(!name){$("nm").focus();return}
  var img=newImg||(editId?get(editId).img:null);
  if(!img){alert("Добавьте фото QR-кода");return}
  var d=+$("dy").value||null;
  if(editId){var i=get(editId);i.name=name;i.store=$("st").value.trim();i.day=d;i.img=img}
  else items.push({id:"q"+Date.now(),name:name,store:$("st").value.trim(),day:d,img:img,done:false,pos:Date.now()});
  save();
  if(filter!=="all"&&(d||0)!==(+filter))filter=d?String(d):"0";
  $("sheetOv").classList.remove("show");render();
};
var rt;
$("reset").onclick=function(){
  var b=this;
  if(b.dataset.arm){items.forEach(function(i){i.done=false});save();render();b.dataset.arm="";b.textContent="Новый месяц";return}
  b.dataset.arm="1";b.textContent="Сбросить все отметки?";
  clearTimeout(rt);rt=setTimeout(function(){b.dataset.arm="";b.textContent="Новый месяц"},3000);
};

var imp={img:null,r:0,fine:0,work:null,rc:null,drag:null,cells:[]};
function showStep(n){$("st1").style.display=n===1?"flex":"none";$("st2").style.display=n===2?"flex":"none"}
function buildWork(){
 var im=imp.img,k=Math.min(1,1600/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
 var sw=imp.r%2?h:w,sh=imp.r%2?w:h,c=document.createElement("canvas");c.width=sw;c.height=sh;
 var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,sw,sh);
 x.translate(sw/2,sh/2);x.rotate(imp.r*Math.PI/2+imp.fine*Math.PI/180);x.drawImage(im,-w/2,-h/2,w,h);
 imp.work=c;
}
function defRect(){var w=imp.work;imp.rc={x0:w.width*.06,y0:w.height*.06,x1:w.width*.94,y1:w.height*.94}}
function fitIc(){var b=$("icbox"),w=imp.work,c=$("ic");if(!w||!b.clientWidth)return;var k=Math.min(b.clientWidth/w.width,b.clientHeight/w.height);c.style.width=Math.floor(w.width*k)+"px";c.style.height=Math.floor(w.height*k)+"px"}
window.addEventListener("resize",fitIc);
function drawImp(){
 var c=$("ic"),w=imp.work;c.width=w.width;c.height=w.height;fitIc();var x=c.getContext("2d");x.drawImage(w,0,0);
 var r=imp.rc,cols=+$("cols").value||4,rows=+$("rows").value||5,lw=Math.max(2,w.width/300),i;
 x.strokeStyle="#0b5fff";x.lineWidth=lw;x.strokeRect(r.x0,r.y0,r.x1-r.x0,r.y1-r.y0);
 x.beginPath();
 for(i=1;i<cols;i++){var X=r.x0+(r.x1-r.x0)*i/cols;x.moveTo(X,r.y0);x.lineTo(X,r.y1)}
 for(i=1;i<rows;i++){var Y=r.y0+(r.y1-r.y0)*i/rows;x.moveTo(r.x0,Y);x.lineTo(r.x1,Y)}
 x.stroke();x.fillStyle="#ff3b30";
 [[r.x0,r.y0],[r.x1,r.y1]].forEach(function(p){x.beginPath();x.arc(p[0],p[1],lw*5,0,7);x.fill()});
}
function pt(e){var b=$("ic").getBoundingClientRect(),w=imp.work;return{x:(e.clientX-b.left)*w.width/b.width,y:(e.clientY-b.top)*w.height/b.height}}

var ocrTok=0,ocrW=null;
function buildHi(){
 var im=imp.img,k=Math.min(1,2800/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
 var sw=imp.r%2?h:w,sh=imp.r%2?w:h,c=document.createElement("canvas");c.width=sw;c.height=sh;
 var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,sw,sh);
 x.translate(sw/2,sh/2);x.rotate(imp.r*Math.PI/2+imp.fine*Math.PI/180);x.drawImage(im,-w/2,-h/2,w,h);
 return c;
}
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++)m[i]=[i];for(j=0;j<=b.length;j++)m[0][j]=j;for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
var LK={"а":"a","в":"b","е":"e","ё":"e","к":"k","м":"m","н":"h","о":"o","р":"p","с":"c","т":"t","у":"y","х":"x"};
var L2C={a:"а",c:"с",e:"е",o:"о",p:"р",x:"х",y:"у",k:"к",m:"м",t:"т",b:"в",h:"н"},C2L={};
Object.keys(L2C).forEach(function(k){C2L[L2C[k]]=k});
function fold(s){return s.toLowerCase().replace(/[а-яё]/g,function(c){return LK[c]||c})}
function mapCh(ch,m){var l=ch.toLowerCase(),r=m[l];if(!r)return ch;return ch===l?r:r.toUpperCase()}
function fixScript(t){return t.split("_").map(function(seg){
 var cy=/[бгджзийлпфцчшщъыьэюя]/i.test(seg),la=/[dfgjlqsvwz]/i.test(seg);
 if(cy&&!la)return seg.replace(/[A-Za-z]/g,function(c){return mapCh(c,L2C)});
 if(la&&!cy)return seg.replace(/[А-Яа-яЁё]/g,function(c){return mapCh(c,C2L)});
 return seg}).join("_")}
function cleanOcr(t){return t.replace(/\s+/g," ").replace(/[^A-Za-zА-Яа-яЁё0-9_.,\/\- ]/g,"").trim().replace(/^[^A-Za-zА-Яа-яЁё0-9]+|[^A-Za-zА-Яа-яЁё0-9\/]+$/g,"")}
function snap(t,known){var f=fold(t),dg=t.replace(/\D/g,""),best=null,bd=99;
 known.forEach(function(k){if(k.replace(/\D/g,"")!==dg)return;var d=lev(f,fold(k));if(d<bd){bd=d;best=k}});
 return best&&bd<=Math.max(1,Math.floor(f.length*.2))?best:t}
function knownStores(){var a=items.map(function(x){return x.store}).filter(Boolean);
 $("impList").querySelectorAll("[data-s]").forEach(function(i){if(i.value&&i.dataset.auto!=="1")a.push(i.value)});
 return Array.from(new Set(a))}
$("impList").addEventListener("change",function(e){
 var t=e.target;if(!t.matches||!t.matches("[data-s]"))return;
 var v=t.value.trim();delete t.dataset.auto;if(!v)return;
 $("impList").querySelectorAll("[data-s]").forEach(function(o){
  if(o===t||o.dataset.auto!=="1")return;
  var b=fold(v);
  if(o.value!==v&&o.value.replace(/\D/g,"")===v.replace(/\D/g,"")&&lev(fold(o.value),b)<=Math.max(1,Math.floor(b.length*.2))){o.value=v;delete o.dataset.auto}
 });
});
async function runOcr(r,cols,rows){
 var tok=++ocrTok,st=$("ocrSt");st.textContent="Распознаю названия…";
 try{
  var base=new URL("ocr/",location.href).href;
  if(!window.Tesseract)await loadScript(base+"tesseract.min.js");
  if(!ocrW)ocrW=await Tesseract.createWorker(["rus","eng"],1,{workerPath:base+"worker.min.js",corePath:base,langPath:base,workerBlobURL:false});
  await ocrW.setParameters({tessedit_pageseg_mode:"7"});
  var hi=buildHi(),f=hi.width/imp.work.width,cw=(r.x1-r.x0)/cols*f,ch=(r.y1-r.y0)/rows*f,known=items.map(function(x){return x.store}).filter(Boolean),inputs=$("impList").querySelectorAll("[data-s]");
  for(var n=0;n<cols*rows;n++){
    if(tok!==ocrTok)return;
    var i=n%cols,j=Math.floor(n/cols),c=document.createElement("canvas"),sh=ch*.22,sc=Math.min(3,Math.max(2,100/sh),2400/cw);
    c.width=Math.round(cw*sc);c.height=Math.round(sh*sc);
    var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
    x.drawImage(hi,r.x0*f+i*cw,r.y0*f+j*ch,cw,sh,0,0,c.width,c.height);
    var res=await ocrW.recognize(c),t=cleanOcr(res.data.text);
    if(t){t=snap(fixScript(t),knownStores());if(!inputs[n].value){inputs[n].value=t;inputs[n].dataset.auto="1"}}
    st.textContent="Распознаю названия: "+(n+1)+" из "+cols*rows;
  }
  st.textContent="Исправьте неверное название один раз, похожие поправятся сами";
 }catch(e){st.textContent="Автоматическое чтение недоступно, впишите названия вручную"}
 try{if(ocrW&&tok===ocrTok){ocrW.terminate();ocrW=null}}catch(e){}
}
